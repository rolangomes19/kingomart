<style>/* KingoMart storefront prototype.
   World: the Mediterranean crossing. Sea-ink stage, palette-driven sea-to-lagoon gradient, colored packshot backdrops.
   Every value comes from the tokens in :root (documented in DESIGN.md). Exceptions: 0, 1-2px hairlines, %, em tracking. */
@property --acc { syntax: '<color>'; inherits: true; initial-value: oklch(0.47 0.13 245); }
@property --acc2 { syntax: '<color>'; inherits: true; initial-value: oklch(0.74 0.12 195); }

:root {
  color-scheme: light;

  /* ---- Color: brand (palette-driven) ---- */
  --acc: oklch(0.47 0.13 245);
  --acc2: oklch(0.74 0.12 195);
  --acc-h: color-mix(in oklch, var(--acc), var(--night) 22%);
  --acc-t: color-mix(in oklch, var(--acc) 9%, white);
  --acc-t2: color-mix(in oklch, var(--acc) 4.5%, white);
  --acc-l: color-mix(in oklch, var(--acc) 24%, white);
  --acc-sh: color-mix(in oklch, var(--acc) 40%, transparent);
  --grad: linear-gradient(120deg, color-mix(in oklch, var(--acc), var(--acc2) 18%) 0%, var(--acc) 55%, var(--acc-h) 100%);
  --grad-soft: linear-gradient(120deg, color-mix(in oklch, var(--acc2) 22%, white), color-mix(in oklch, var(--acc) 10%, white));
  --sun: oklch(0.7 0.16 48);
  --sun-ink: oklch(0.5 0.15 40);
  --sun-b: oklch(0.96 0.035 60);

  /* ---- Color: surfaces and ink ---- */
  --night: oklch(0.19 0.04 256);
  --night2: oklch(0.25 0.055 252);
  --bg: oklch(0.982 0.004 250);
  --card: oklch(0.999 0.001 250);
  --well: oklch(0.965 0.007 250);
  --ink: oklch(0.21 0.03 258);
  --ink2: oklch(0.37 0.025 258);
  --mut: oklch(0.5 0.02 258);
  --mut2: oklch(0.66 0.015 258);
  --line: oklch(0.925 0.008 255);
  --line2: oklch(0.865 0.012 255);
  --on-night: oklch(0.985 0.004 250);
  --on-night-2: oklch(0.87 0.03 240);
  --on-night-3: oklch(0.74 0.03 245);
  --veil-1: oklch(1 0 0 / 0.08);
  --veil-2: oklch(1 0 0 / 0.16);
  --veil-3: oklch(1 0 0 / 0.26);
  --veil-4: oklch(1 0 0 / 0.88);
  --shade: oklch(0.25 0.04 255);
  --img-ring: oklch(0 0 0 / 0.07);

  /* ---- Color: status ---- */
  --ok: oklch(0.47 0.11 155); --ok-b: oklch(0.96 0.04 155); --ok-l: oklch(0.88 0.06 150);
  --warn: oklch(0.5 0.12 62); --warn-b: oklch(0.965 0.05 80); --warn-l: oklch(0.88 0.08 80);
  --bad: oklch(0.5 0.17 27); --bad-b: oklch(0.962 0.03 25); --bad-l: oklch(0.88 0.06 25);

  /* ---- Type ---- */
  --display: 'Bricolage Grotesque', 'Geist', 'Noto Sans Arabic', system-ui, sans-serif;
  --body: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --fs-0: 11px;   /* micro: counters, compact badges */
  --fs-1: 12px;   /* labels, meta */
  --fs-2: 13px;   /* secondary text */
  --fs-3: 14px;   /* controls, small body */
  --fs-4: 15px;   /* body */
  --fs-5: 17px;   /* lead, card titles */
  --fs-6: 20px;   /* h3, prices */
  --fs-7: 24px;   /* h2 in blocks, route */
  --fs-8: 28px;   /* big numbers */
  --fs-sec: clamp(28px, 3.2vw, 40px);
  --fs-page: clamp(32px, 4vw, 48px);
  --fs-hero: clamp(40px, 5.2vw, 68px);
  --fs-wm: clamp(64px, 15vw, 220px);
  --fs-hero-sm: 38px;
  --fs-input: 16px; /* 16px stops iOS zooming into fields */
  --fs-logo: 21px; --fs-logo-sm: 19px;
  --fw-reg: 400; --fw-med: 500; --fw-semi: 600; --fw-display: 650; --fw-bold: 700;
  --lh-tight: 1.04; --lh-head: 1.12; --lh-body: 1.55;
  --tr-display: -0.035em; --tr-head: -0.025em; --tr-num: -0.02em; --tr-label: 0.02em;

  /* ---- Space (4px base) ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 32px;
  --sp-8: 40px; --sp-9: 48px; --sp-10: 56px; --sp-11: 64px; --sp-12: 72px; --sp-13: 104px; --sp-14: 120px;

  /* ---- Size ---- */
  --h-xs: 26px;  /* chips */
  --h-sm: 38px;  /* small buttons */
  --h-md: 42px;  /* pill controls, order button */
  --h-lg: 48px;  /* buttons, inputs, stepper */
  --ico: 18px; --ico-sm: 15px; --ico-lg: 22px;
  --dot: 10px;

  /* ---- Radius (concentric: outer = inner + padding) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-2xl: 28px; --r-pill: 999px;

  /* ---- Elevation ---- */
  --ring: 0 0 0 1px var(--line);
  --ring-2: 0 0 0 1px var(--line2);
  --ring-acc: 0 0 0 2px var(--acc);
  --sh-1: 0 1px 2px color-mix(in oklch, var(--shade) 5%, transparent), 0 10px 30px -18px color-mix(in oklch, var(--shade) 22%, transparent);
  --sh-2: 0 2px 4px color-mix(in oklch, var(--shade) 4%, transparent), 0 24px 44px -24px var(--acc-sh);
  --sh-3: 0 2px 6px color-mix(in oklch, var(--shade) 6%, transparent), 0 30px 60px -28px color-mix(in oklch, var(--shade) 42%, transparent);
  --sh-btn: inset 0 1px 0 var(--veil-2), 0 8px 18px -12px var(--acc-sh);
  --sh-btn-h: inset 0 1px 0 var(--veil-2), 0 16px 30px -14px var(--acc-sh);

  /* ---- Motion (Emil Kowalski curves) ---- */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --dur-press: 140ms;  /* press feedback */
  --dur-fast: 200ms;   /* hover, color, small state */
  --dur-base: 280ms;   /* popovers, cards, toasts */
  --dur-slow: 420ms;   /* sheets, panels */
  --dur-reveal: 800ms; /* one-time reveals */
  --dur-draw: 1400ms;  /* route and step lines */
  --stagger: 50ms; --stagger-lg: 80ms; --stagger-step: 260ms; /* list, hero and step-line cascades */
  --press: 0.97;
  --lift: -3px;

  --sh-h: 48px; /* presenter strip height */
}
[data-pal='cobalt'] { --acc: oklch(0.46 0.17 266); --acc2: oklch(0.73 0.12 228); }
[data-pal='forest'] { --acc: oklch(0.45 0.1 158); --acc2: oklch(0.8 0.13 122); }
[data-pal='plum'] { --acc: oklch(0.43 0.14 348); --acc2: oklch(0.76 0.12 32); }
html { transition: --acc var(--dur-slow) var(--ease-out), --acc2 var(--dur-slow) var(--ease-out); }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--body); background: var(--bg); color: var(--ink); font-size: var(--fs-4); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; }
::selection { background: color-mix(in oklch, var(--acc2) 45%, white); color: var(--ink); }
input, textarea { caret-color: var(--acc); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: var(--fw-display); letter-spacing: var(--tr-head); line-height: var(--lh-head); text-wrap: balance; font-optical-sizing: auto; }
h1 { font-stretch: 94%; }
p { text-wrap: pretty; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg.i { width: var(--ico); height: var(--ico); fill: currentColor; flex: none; } /* Phosphor: filled outlines on a 256 grid */
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: var(--tr-num); }
.mut { color: var(--mut); }
.ink { color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: var(--r-xs); }
.skip { position: absolute; inset-inline-start: var(--sp-2); top: -60px; z-index: 99; background: var(--card); box-shadow: var(--ring-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); }
.skip:focus { top: var(--sp-2); }

/* ---------- Utilities (screen markup uses these instead of inline values) ---------- */
.t-1 { font-size: var(--fs-1); } .t-2 { font-size: var(--fs-2); } .t-3 { font-size: var(--fs-3); } .t-4 { font-size: var(--fs-4); }
.t-5 { font-size: var(--fs-5); } .t-6 { font-size: var(--fs-6); } .t-7 { font-size: var(--fs-7); }
.fw-semi { font-weight: var(--fw-semi); }
.row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.row.end { justify-content: flex-end; } .row.btw { justify-content: space-between; } .row.top { align-items: flex-start; } .row.c { justify-content: center; }
.stack { display: grid; gap: var(--sp-3); } .stack.lg { gap: var(--sp-6); } .stack.xl { gap: var(--sp-7); }
.mt-1 { margin-top: var(--sp-1); } .mt-2 { margin-top: var(--sp-2); } .mt-3 { margin-top: var(--sp-3); } .mt-4 { margin-top: var(--sp-4); }

/* ---------- Presenter strip ---------- */

.sbtn { height: 32px; padding: 0 var(--sp-3); border-radius: var(--r-pill); background: var(--veil-1); color: var(--on-night-2); display: inline-flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-med); white-space: nowrap; transition: background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }

/* ---------- Stage and viewport ---------- */

/* ---------- Header ---------- */
.hd { position: sticky; top: 0; z-index: 30; background: color-mix(in oklch, var(--bg) 92%, transparent); transition: background-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease; }

.hd-top { display: flex; align-items: center; gap: var(--sp-4) var(--sp-7); padding-block: var(--sp-3); }

.mainnav { display: flex; gap: var(--sp-1) var(--sp-7); flex-wrap: wrap; }
.mainnav a { position: relative; padding: var(--sp-2) 0 var(--sp-3); font-size: var(--fs-3); color: var(--ink2); font-weight: var(--fw-med); transition: color var(--dur-fast) ease; }
.mainnav a::after { content: ''; position: absolute; inset-inline: 0; bottom: var(--sp-1); height: 2px; border-radius: 2px; background: var(--grad); transform: scaleX(0); transition: transform var(--dur-base) var(--ease-out); }

.pill { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 32px; padding: 0 var(--sp-4); border-radius: var(--r-pill); font-weight: var(--fw-semi); font-size: var(--fs-2); }

  .ordl:hover { background: var(--night2); box-shadow: 0 10px 22px -14px color-mix(in oklch, var(--shade) 70%, transparent); }
  .mainnav a:hover { color: var(--ink); }

}

/* search dropdown: grows from the field */
.sdd { position: absolute; inset-inline: 0; top: calc(100% + var(--sp-2)); background: var(--card); border-radius: var(--r-lg); box-shadow: var(--ring), var(--sh-3); padding: var(--sp-2); z-index: 40; max-height: 70vh; overflow: auto; transform-origin: top center; transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }

.sk { height: var(--sp-4); border-radius: var(--r-xs); background: linear-gradient(90deg, var(--well), var(--line), var(--well)); background-size: 200% 100%; animation: sk 1.1s linear infinite; }

@keyframes sk { to { background-position: -200% 0; } }

/* ---------- Buttons ---------- */
.btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); min-height: var(--h-lg); padding: 0 var(--sp-6); border-radius: var(--r-pill); background: var(--grad); color: var(--on-night); font-weight: var(--fw-semi); font-size: var(--fs-4); border: 0; white-space: nowrap; box-shadow: var(--sh-btn); transition: box-shadow var(--dur-fast) ease, transform var(--dur-press) var(--ease-out), filter var(--dur-fast) ease, background-color var(--dur-fast) ease; }

@keyframes rot { to { transform: rotate(360deg); } }
/* Label swap for a state change: both labels stay in the DOM and crossfade with a 2px blur. */
.swap { display: inline-grid; place-items: center; }
.swap > span { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: var(--sp-2); transition: opacity var(--dur-fast) var(--ease-out), filter var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.swap > span:last-child { opacity: 0; filter: blur(2px); transform: translateY(25%); }

.btn.done .swap > span:last-child { opacity: 1; filter: none; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { box-shadow: var(--sh-btn-h); filter: saturate(1.08) brightness(1.04); }
  .btn.ghost:hover { background: var(--well); box-shadow: 0 0 0 1px color-mix(in oklch, var(--acc) 30%, var(--line2)); filter: none; }
  .btn.light:hover { box-shadow: 0 14px 30px -12px oklch(0 0 0 / 0.6); filter: none; }
  .btn.glass:hover { background: var(--veil-2); filter: none; }
  .btn.off:hover, .btn[disabled]:hover { box-shadow: var(--ring); filter: none; background: var(--well); }
  .btn:hover svg.flip, .lnk:hover svg.flip, .ot:hover .ct svg.flip, .offer:hover .lnk svg.flip { transform: translateX(3px); }
  [dir='rtl'] .btn:hover svg.flip, [dir='rtl'] .lnk:hover svg.flip, [dir='rtl'] .ot:hover .ct svg.flip, [dir='rtl'] .offer:hover .lnk svg.flip { transform: scaleX(-1) translateX(3px); }
  .lnk:hover { color: var(--acc-h); }
}

/* ---------- Chips, pills, fields ---------- */
.chip { display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-xs); padding: 0 var(--sp-3); border-radius: var(--r-pill); background: var(--well); color: var(--ink2); font-size: var(--fs-1); font-weight: var(--fw-semi); white-space: nowrap; }

.chip.ok { background: var(--ok-b); color: var(--ok); } .chip.warn { background: var(--warn-b); color: var(--warn); } .chip.bad { background: var(--bad-b); color: var(--bad); } .chip.acc { background: var(--acc-t); color: var(--acc); }

.fc { height: var(--h-md); padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 0; box-shadow: var(--ring-2); background: var(--card); font-weight: var(--fw-med); font-size: var(--fs-3); color: var(--ink); display: inline-flex; align-items: center; gap: var(--sp-2); transition: background-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease, color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }

.tabs { display: inline-flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: var(--sp-2); font-size: var(--fs-2); font-weight: var(--fw-med); min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field input, .field select, .field textarea { height: var(--h-lg); border: 0; box-shadow: var(--ring-2); border-radius: var(--r-md); padding: 0 var(--sp-4); background: var(--card); font-size: var(--fs-input); font-weight: var(--fw-reg); transition: box-shadow var(--dur-fast) ease; }
.field input:focus, .field select:focus { outline: 0; box-shadow: 0 0 0 1px var(--acc), 0 0 0 5px var(--acc-t); }
.field input::placeholder { color: var(--mut); }

@media (hover: hover) and (pointer: fine) { .field input:hover:not(:focus) { box-shadow: 0 0 0 1px color-mix(in oklch, var(--acc) 30%, var(--line2)); } }
.chk { display: flex; gap: var(--sp-3); align-items: flex-start; cursor: pointer; font-size: var(--fs-3); }

.card.soft { background: var(--grad-soft); box-shadow: none; }
.card h3 { font-size: var(--fs-5); }
.rowb { display: flex; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-2) 0; font-size: var(--fs-3); }
.rowb.tot { border-top: 1px solid var(--line); margin-top: var(--sp-2); padding-top: var(--sp-4); font-weight: var(--fw-semi); font-size: var(--fs-5); }
.rowb .big { font-size: var(--fs-7); }
.dl > div { display: grid; grid-template-columns: minmax(120px, 0.45fr) 1fr; gap: var(--sp-4); padding: var(--sp-3) 0; border-top: 1px solid var(--line); font-size: var(--fs-3); }
.dl > div:first-child { border-top: 0; }
.dl dt { color: var(--mut); } .dl dd { margin: 0; }
.dl { margin: 0; }
.smp { display: none; align-items: center; height: 18px; padding: 0 var(--sp-2); margin-inline-start: var(--sp-2); border-radius: var(--r-xs); background: var(--warn-b); color: var(--warn); font: var(--fw-semi) var(--fs-0)/18px var(--mono); letter-spacing: var(--tr-label); text-transform: uppercase; vertical-align: 1px; }
.marks .smp { display: inline-flex; }

/* ---------- Product art: colored packshot backdrop; photo if supplied, else pictogram ---------- */
.ph { --h: 230; position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-md); display: grid; place-items: center; overflow: hidden; isolation: isolate;
  background: radial-gradient(90% 80% at 28% 18%, oklch(0.975 0.03 var(--h)), transparent 60%), radial-gradient(100% 100% at 85% 100%, oklch(0.86 0.09 calc(var(--h) + 18)), transparent 70%), oklch(0.93 0.055 var(--h)); }
.ph::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--img-ring); pointer-events: none; z-index: 3; }
.ph svg.pk { width: 40%; height: auto; max-height: 70%; fill: currentColor; color: oklch(0.36 0.08 var(--h) / 0.6); filter: drop-shadow(0 10px 12px oklch(0.3 0.08 var(--h) / 0.18)); transition: transform var(--dur-slow) var(--ease-out); }
.ph img.shot { position: absolute; inset: 7%; width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 14px 16px oklch(0.25 0.08 var(--h) / 0.3)); transition: transform var(--dur-slow) var(--ease-out); }

.org { display: inline-block; width: var(--sp-6); height: var(--sp-4); border-radius: 3px; background: var(--well) center/cover no-repeat; box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.14); flex: none; vertical-align: -3px; }

/* ---------- Home: the crossing stage ---------- */

/* departure card */

.bar { height: var(--dot); border-radius: var(--r-pill); background: var(--well); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }

[dir='rtl'] .meter.in .pm .m { clip-path: inset(0 0 0 calc((1 - var(--f)) * 100%)); }

.big { font: var(--fw-semi) var(--fs-8)/1.1 var(--mono); letter-spacing: -0.04em; }

.ot:first-child { grid-row: span 2; padding: var(--sp-7); }
.ot::before { content: ''; position: absolute; inset: 0; z-index: -2; background: var(--og); transition: transform var(--dur-reveal) var(--ease-out); }
.ot::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 25%, oklch(0.15 0.03 256 / 0.35) 50%, oklch(0.13 0.03 256 / 0.85)); }
.ot img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-reveal) var(--ease-out); }
.ot:active { transform: scale(0.99); }
/* line illustrations (any single-color art) are drawn white, top-right, so one file works on every tile */
.ot img.illus { inset: var(--sp-6) var(--sp-6) auto auto; width: 46%; height: 62%; object-fit: contain; object-position: top right; filter: brightness(0) invert(1); opacity: 0.88; z-index: -1; }
.ot:hover img.illus { transform: translateY(-4px); }
.ot .org { width: 34px; height: 23px; border-radius: var(--r-xs); box-shadow: 0 0 0 2px var(--veil-4); margin-bottom: auto; }
.ot b { font: var(--fw-display) var(--fs-7)/var(--lh-head) var(--display); letter-spacing: var(--tr-display); }
.ot:first-child b { font-size: var(--fs-sec); }
.ot p { color: var(--on-night-2); font-size: var(--fs-3); max-width: 36ch; text-shadow: 0 1px 12px oklch(0 0 0 / 0.4); }
.ot .ct { margin-top: var(--sp-3); display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-2); font-weight: var(--fw-semi); padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4); border-radius: var(--r-pill); background: var(--veil-2); backdrop-filter: blur(8px); align-self: flex-start; transition: background-color var(--dur-fast) ease; }

@media (hover: hover) and (pointer: fine) { .ot:hover { transform: translateY(var(--lift)); box-shadow: var(--sh-3); } .ot:hover::before, .ot:hover img { transform: scale(1.05); } .ot:hover .ct { background: var(--veil-3); } }

.ot-US { --og: radial-gradient(80% 80% at 90% 0%, oklch(0.55 0.16 25 / 0.75), transparent 60%), oklch(0.33 0.09 262); }
.ot-VN { --og: radial-gradient(80% 80% at 80% 10%, oklch(0.8 0.15 85 / 0.6), transparent 60%), oklch(0.45 0.16 28); }
.ot-BR { --og: radial-gradient(80% 80% at 85% 10%, oklch(0.85 0.16 100 / 0.55), transparent 60%), oklch(0.42 0.11 152); }
.ot-BE { --og: radial-gradient(80% 80% at 85% 10%, oklch(0.82 0.15 90 / 0.5), transparent 60%), radial-gradient(60% 60% at 0% 100%, oklch(0.55 0.18 28 / 0.5), transparent 60%), oklch(0.27 0.02 260); }

/* how it works: one tinted panel, a voyage line through five steps */
.how { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--r-2xl); padding: var(--sp-10); background: var(--grad-soft); }
.how::before { content: ''; position: absolute; inset: auto -10% -60% auto; width: 60%; aspect-ratio: 1; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklch, var(--acc2) 30%, transparent), transparent 70%); }
.how-h { max-width: 58ch; margin-bottom: var(--sp-9); }

.steps { --n: 44px; position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }

.steps.in .step .n { background-color: var(--acc); color: var(--on-night); box-shadow: 0 0 0 5px color-mix(in oklch, var(--acc2) 18%, white), 0 8px 18px -10px var(--acc-sh); transition-delay: calc(var(--dur-fast) + var(--d, 0) * var(--stagger-step)); }
.step b { display: block; margin-top: var(--sp-5); font: var(--fw-semi) var(--fs-5)/1.2 var(--display); letter-spacing: var(--tr-num); }

.step p { font-size: var(--fs-3); color: var(--ink2); margin-top: var(--sp-2); }
.split2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-7); align-items: center; }
.cta-panel { border-radius: var(--r-2xl); padding: var(--sp-9); background: var(--card); box-shadow: var(--ring), var(--sh-1); }
.brands { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-7) var(--sp-10); padding: var(--sp-7) var(--sp-6); border-radius: var(--r-xl); }
.brands img { height: var(--sp-8); width: auto; max-width: 140px; object-fit: contain; filter: grayscale(1) contrast(1.1); opacity: 0.72; transition: filter var(--dur-base) ease, opacity var(--dur-base) ease; }
@media (hover: hover) and (pointer: fine) { .brands img:hover { filter: none; opacity: 1; } }

/* ---------- Footer: sea-ink, wordmark ---------- */
.ft { position: relative; overflow: hidden; isolation: isolate; margin-top: var(--sp-14); background: var(--night); color: var(--on-night-2); }
.ft::after { content: ''; position: absolute; inset: -40% auto auto -10%; width: 50%; aspect-ratio: 1; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklch, var(--acc) 55%, transparent), transparent 70%); opacity: 0.6; }
.ft-g { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: var(--sp-8); padding-block: var(--sp-11) var(--sp-8); }
.ft .logo { color: var(--on-night); }
.ft h4 { font: var(--fw-semi) var(--fs-3) var(--display); margin-bottom: var(--sp-4); letter-spacing: 0; color: var(--on-night); }
.ft li { margin-bottom: var(--sp-3); font-size: var(--fs-3); color: var(--on-night-3); }
.ft a { transition: color var(--dur-fast) ease; }
.ft p { font-size: var(--fs-3); color: var(--on-night-3); margin-top: var(--sp-4); }

.ft .cl { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
.ft .cl svg.i { width: var(--ico-sm); height: var(--ico-sm); color: var(--acc2); }
.ft .legal { padding-block: var(--sp-5) var(--sp-7); border-top: 1px solid var(--veil-1); font-size: var(--fs-2); color: var(--on-night-3); }
.ft .wm { font: var(--fw-bold) var(--fs-wm)/0.8 var(--display); letter-spacing: -0.06em; font-stretch: 85%; color: oklch(1 0 0 / 0.06); white-space: nowrap; margin-bottom: -0.12em; user-select: none; }
@media (hover: hover) and (pointer: fine) { .ft a:hover { color: var(--on-night); } }

/* ---------- Catalogue ---------- */
.crumb { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; font-size: var(--fs-2); color: var(--mut); padding-block: var(--sp-6) 0; }
.crumb.flat { padding-top: 0; }
.crumb svg.i { width: 14px; height: 14px; }
.cat { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--sp-8); align-items: start; }
.fil { position: sticky; top: 130px; display: grid; gap: var(--sp-6); }

.fil h4 { font-size: var(--fs-3); letter-spacing: 0; margin-bottom: var(--sp-3); }
.fil label { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); margin-inline: calc(var(--sp-3) * -1); border-radius: var(--r-sm); font-size: var(--fs-3); cursor: pointer; transition: background-color var(--dur-fast) ease; }
.fil input { width: 18px; height: 18px; accent-color: var(--acc); }
@media (hover: hover) and (pointer: fine) { .fil label:hover { background: var(--well); } .crumb a:hover { color: var(--acc); } }
.tools { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3) var(--sp-5); flex-wrap: wrap; margin-bottom: var(--sp-6); }
.empty { padding: var(--sp-11) var(--sp-6); text-align: center; border-radius: var(--r-xl); background: var(--grad-soft); display: grid; gap: var(--sp-3); justify-items: center; }
.empty .ico { width: var(--sp-10); height: var(--sp-10); border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--acc); box-shadow: var(--sh-1); margin-bottom: var(--sp-2); }
.empty .ico svg.i { width: var(--ico-lg); height: var(--ico-lg); }
.empty h3 { font-size: var(--fs-6); }
.empty p { max-width: 44ch; color: var(--mut); }
.lrow { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: var(--sp-5); align-items: center; padding: var(--sp-3); border-top: 1px solid var(--line); transition: background-color var(--dur-fast) ease; }
.lrow:first-child { border-top: 0; }
.lrow .ph { aspect-ratio: 1; }
.lrow .ph svg.pk { width: 52%; }
.lrow b { font-size: var(--fs-5); }
.lrow .px { display: grid; gap: 2px; text-align: end; justify-items: end; font-size: var(--fs-2); }
@media (hover: hover) and (pointer: fine) { a.lrow:hover { background: var(--acc-t2); } }

/* ---------- Product ---------- */
.pdp { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: var(--sp-10); padding-top: var(--sp-7); align-items: start; }
.gal { position: sticky; top: 130px; display: grid; gap: var(--sp-3); }
.gal > .ph { aspect-ratio: 1; border-radius: var(--r-xl); }
.gal > .ph svg.pk { width: 44%; }
.gal > .ph svg.pk, .gal > .ph img.shot:not(.full) { animation: bob 6s var(--ease-in-out) infinite alternate; }
@keyframes bob { to { transform: translateY(-8px) rotate(-1.5deg); } }
/* the gallery image crossfades in only when a thumbnail is picked */
.gal > .ph.swapin > img, .gal > .ph.swapin > svg.pk { animation: galin var(--dur-base) var(--ease-out); }
@keyframes galin { from { opacity: 0; filter: blur(4px); transform: scale(0.98); } }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); }
.thumbs button { border-radius: var(--r-md); padding: 0; transition: transform var(--dur-press) var(--ease-out), box-shadow var(--dur-fast) ease; }
.thumbs button .ph { aspect-ratio: 1; }
.thumbs button .ph svg.pk { width: 50%; }
.thumbs button[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
.thumbs button:active { transform: scale(var(--press)); }
.pdp h1 { font-size: var(--fs-page); letter-spacing: -0.04em; }
.chips { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); margin-top: var(--sp-6); }
.facts > div { display: grid; gap: 2px; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--card); box-shadow: var(--ring); font-size: var(--fs-3); }
.facts span:first-child { color: var(--mut); font-size: var(--fs-1); }
.blk { margin-top: var(--sp-8); }
.blk > h2 { font-size: var(--fs-7); margin-bottom: var(--sp-4); }
.note { font-size: var(--fs-2); color: var(--mut); margin-top: var(--sp-3); }
.otbl { display: grid; gap: var(--sp-2); }
.orow2 { display: grid; grid-template-columns: var(--sp-5) minmax(150px, 1.6fr) minmax(90px, 0.7fr) minmax(90px, 1fr) minmax(100px, 1fr); gap: var(--sp-4); align-items: center; text-align: start; border-radius: var(--r-lg); padding: var(--sp-4); background: var(--card); box-shadow: var(--ring); width: 100%; transition: box-shadow var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.orow2.th { box-shadow: none; background: none; padding-block: 0; font-size: var(--fs-1); color: var(--mut); }
button.orow2:active { transform: scale(0.99); }
.orow2[aria-pressed='true'] { box-shadow: var(--ring-acc), 0 12px 26px -18px var(--acc-sh); background: var(--acc-t2); }
.dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--mut2); background: var(--card); transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) ease; flex: none; }
[aria-pressed='true'] > .dot, [aria-checked='true'] > .dot, [aria-pressed='true'] .hd2 > .dot, .dot.on { background: var(--acc); box-shadow: inset 0 0 0 4px var(--card), 0 0 0 1.5px var(--acc); }
.stepper { display: inline-flex; align-items: center; border-radius: var(--r-pill); background: var(--card); box-shadow: var(--ring-2); overflow: hidden; }
.stepper button { width: var(--h-lg); height: var(--h-lg); display: grid; place-items: center; transition: background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.stepper button:active { transform: scale(0.9); }
.stepper button[disabled] { color: var(--mut2); cursor: not-allowed; }
.stepper button[disabled]:active { transform: none; }
.stepper output { min-width: var(--h-lg); text-align: center; font: var(--fw-semi) var(--fs-5) var(--mono); overflow: hidden; }
.stepper output span { display: inline-block; }
/* quantity rolls in the direction of the change */
.stepper output.up span { animation: rollup var(--dur-fast) var(--ease-out); }
.stepper output.down span { animation: rolldown var(--dur-fast) var(--ease-out); }
@keyframes rollup { from { transform: translateY(60%); opacity: 0; filter: blur(2px); } }
@keyframes rolldown { from { transform: translateY(-60%); opacity: 0; filter: blur(2px); } }
@media (hover: hover) and (pointer: fine) { .stepper button:not([disabled]):hover { background: var(--well); } button.orow2:hover:not([aria-pressed='true']) { box-shadow: var(--ring-2), var(--sh-1); } }
.depc { display: grid; gap: var(--sp-3); }
.dcard { display: grid; gap: var(--sp-4); text-align: start; padding: var(--sp-5); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--ring); width: 100%; transition: box-shadow var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.dcard:active { transform: scale(0.99); }
.dcard[aria-pressed='true'] { box-shadow: var(--ring-acc), 0 14px 30px -20px var(--acc-sh); background: var(--acc-t2); }
.dcard .hd2 { display: flex; gap: var(--sp-3); align-items: center; }
.dcard .k3 { font-size: var(--fs-2); }
.dcard .k3 > div { background: color-mix(in oklch, var(--well) 70%, transparent); }
.dcard .rate { margin-inline-start: auto; text-align: end; }
@media (hover: hover) and (pointer: fine) { .dcard:hover:not([aria-pressed='true']) { box-shadow: var(--ring-2), var(--sh-1); } }
.est { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--r-xl); padding: var(--sp-6); background: var(--night); color: var(--on-night-2); }
.est::before { content: ''; position: absolute; inset: -50% -20% auto auto; width: 80%; aspect-ratio: 1; z-index: -1; background: radial-gradient(closest-side, color-mix(in oklch, var(--acc) 70%, transparent), transparent 70%); opacity: 0.7; }
.est h2 { font-size: var(--fs-6); margin-bottom: var(--sp-4); color: var(--on-night); }
.est .mono, .est b { color: var(--on-night); }
.est .rowb.tot { border-color: var(--veil-2); }
.est .big { font-size: var(--fs-8); }
.est .mut, .est .note { color: var(--on-night-3); }
.est .imp { border-color: var(--veil-2); }
.imp { margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px dashed var(--line2); display: grid; gap: var(--sp-2); font-size: var(--fs-2); }
.imp div { display: grid; grid-template-columns: 1fr 1.4fr; gap: var(--sp-3); }
.notice { display: flex; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-radius: var(--r-lg); background: var(--acc-t2); box-shadow: inset 0 0 0 1px var(--acc-l); font-size: var(--fs-3); align-items: flex-start; }
.notice > svg { color: var(--acc); margin-top: 2px; }
.notice.warn { background: var(--warn-b); box-shadow: inset 0 0 0 1px var(--warn-l); } .notice.warn > svg { color: var(--warn); }
.notice.bad { background: var(--bad-b); box-shadow: inset 0 0 0 1px var(--bad-l); } .notice.bad > svg { color: var(--bad); }
.notice.ok { background: var(--ok-b); box-shadow: inset 0 0 0 1px var(--ok-l); } .notice.ok > svg { color: var(--ok); }
/* accordion */
.acc-d summary { cursor: pointer; padding: var(--sp-5) 0; font: var(--fw-semi) var(--fs-5) var(--display); letter-spacing: var(--tr-num); list-style: none; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); transition: color var(--dur-fast) ease; }
.acc-d summary::-webkit-details-marker { display: none; }
.acc-d summary svg { transition: transform var(--dur-base) var(--ease-out); }
.acc-d[open] summary svg { transform: rotate(180deg); }
.acc-d .in-b { padding-bottom: var(--sp-5); }
.acc-d[open] .in-b { animation: accin var(--dur-base) var(--ease-out); }
@keyframes accin { from { opacity: 0; transform: translateY(calc(var(--sp-2) * -1)); } }
@media (hover: hover) and (pointer: fine) { .acc-d summary:hover { color: var(--acc); } }
.pbar { display: none; }

/* ---------- Order, checkout ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.9fr); gap: var(--sp-8); align-items: start; }
.side { position: sticky; top: 130px; display: grid; gap: var(--sp-4); }
.grp { overflow: hidden; margin-bottom: var(--sp-5); }
.grp-h { padding: var(--sp-6); background: var(--grad-soft); display: grid; gap: var(--sp-4); }
.grp-h .k3 > div { background: var(--veil-4); }
.grp-h .t { display: flex; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; align-items: center; }
.grp-h .t b { font-size: var(--fs-5); }
.line { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: var(--sp-5); align-items: center; padding: var(--sp-5) var(--sp-6); border-top: 1px solid var(--line); }
.line .ph { aspect-ratio: 1; }
.line .ph svg.pk { width: 52%; }
.line .tot { text-align: end; display: grid; gap: var(--sp-2); justify-items: end; }
.line b.nm { font-size: var(--fs-5); }
.rad { display: flex; gap: var(--sp-4); align-items: flex-start; text-align: start; padding: var(--sp-5); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--ring); width: 100%; transition: box-shadow var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.rad:active { transform: scale(0.99); }
.rad[aria-checked='true'] { box-shadow: var(--ring-acc); background: var(--acc-t2); }
.rad .dot { margin-top: 3px; }
@media (hover: hover) and (pointer: fine) { .rad:hover:not([aria-checked='true']) { box-shadow: var(--ring-2), var(--sh-1); } }
.fs { display: grid; gap: var(--sp-4); }
.fs-h { display: flex; gap: var(--sp-4); align-items: center; margin-bottom: var(--sp-1); }
.fs-h h2 { font-size: var(--fs-7); }
.num { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); color: var(--on-night); display: grid; place-items: center; font: var(--fw-semi) var(--fs-2) var(--mono); flex: none; box-shadow: 0 6px 14px -8px var(--acc-sh); }
.ok-ring { position: relative; width: var(--sp-12); height: var(--sp-12); border-radius: 50%; background: linear-gradient(135deg, oklch(0.62 0.13 160), var(--ok)); color: var(--on-night); display: grid; place-items: center; flex: none; box-shadow: 0 0 0 var(--sp-2) var(--ok-b), 0 14px 30px -12px color-mix(in oklch, var(--ok) 70%, transparent); animation: ringin var(--dur-slow) var(--ease-out) both; }
.ok-ring.sm { width: var(--sp-8); height: var(--sp-8); box-shadow: 0 0 0 var(--sp-1) var(--ok-b); }
.ok-ring.sm svg { width: var(--ico); height: var(--ico); }
.ok-ring svg { width: 30px; height: 30px; stroke-dasharray: 1; stroke-dashoffset: 1; animation: dash var(--dur-slow) var(--ease-out) var(--dur-fast) forwards; }
@keyframes ringin { from { transform: scale(0.8); opacity: 0; } }
@keyframes dash { to { stroke-dashoffset: 0; } }
.mail { border-radius: var(--r-lg); overflow: hidden; background: var(--card); box-shadow: var(--ring), var(--sh-1); }
.mail .mh { padding: var(--sp-4) var(--sp-5); background: var(--grad-soft); border-bottom: 1px solid var(--line); font-size: var(--fs-2); color: var(--mut); display: grid; gap: 2px; }
.mail .mh b { color: var(--ink); display: inline-flex; gap: var(--sp-2); align-items: center; }
.mail .mb { padding: var(--sp-5); font-size: var(--fs-3); display: grid; gap: var(--sp-3); }
.list-n { display: grid; gap: var(--sp-3); font-size: var(--fs-3); }
.list-n li { display: flex; gap: var(--sp-3); align-items: flex-start; }
.list-n li svg.i { color: var(--acc); margin-top: 2px; }
.hd-row { display: flex; gap: var(--sp-5); align-items: flex-start; flex-wrap: wrap; }
.hd-row > div { flex: 1; min-width: 260px; }

/* ---------- Ladder / orders ---------- */
.lad { position: relative; display: grid; }
.lad li { position: relative; display: grid; grid-template-columns: var(--h-xs) minmax(0, 1fr) auto; gap: var(--sp-4); padding-bottom: var(--sp-6); }
.lad li:last-child { padding-bottom: 0; }
.lad li::before { content: ''; position: absolute; inset-inline-start: calc(var(--h-xs) / 2 - 1px); top: var(--h-xs); bottom: 0; width: 2px; border-radius: 2px; background: var(--line); }
.lad li:last-child::before { display: none; }
.lad li.done::before { background: linear-gradient(180deg, var(--ok), color-mix(in oklch, var(--ok) 60%, var(--acc2))); transform-origin: top; transform: scaleY(0); }
.in .lad li.done::before, .lad.in li.done::before { transform: scaleY(1); transition: transform var(--dur-slow) var(--ease-out) calc(var(--i, 0) * var(--stagger-lg)); }
.lad .dt { width: var(--h-xs); height: var(--h-xs); border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line2); background: var(--card); display: grid; place-items: center; z-index: 1; transition: background-color var(--dur-base) ease, box-shadow var(--dur-base) ease; }
.lad .done .dt { background: var(--ok); box-shadow: none; color: var(--on-night); }
.lad .done .dt svg { width: 14px; height: 14px; }
.lad .now .dt { box-shadow: inset 0 0 0 7px var(--acc), 0 0 0 5px var(--acc-t); }
.lad .bad .dt { background: var(--bad); box-shadow: none; color: var(--on-night); }
.lad b { font-size: var(--fs-4); display: block; }
.lad .now b { color: var(--acc); }
.lad .nx b { color: var(--mut); }
.lad p { font-size: var(--fs-2); color: var(--mut); }
.lad time { font: var(--fw-med) var(--fs-2) var(--mono); color: var(--mut); white-space: nowrap; }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); }
.segs i { display: block; height: var(--sp-2); border-radius: var(--r-pill); background: var(--line); }
.segs i.on { background: var(--grad); } .segs i.half { background: linear-gradient(90deg, var(--acc) 50%, var(--line) 50%); }
.segs.lbls { margin-top: var(--sp-2); font-size: var(--fs-1); color: var(--mut); }
.ordl2 { display: grid; gap: var(--sp-2); align-content: start; }
.ob { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2) var(--sp-4); text-align: start; padding: var(--sp-4); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--ring); width: 100%; transition: box-shadow var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.ob:active { transform: scale(0.99); }
.ob[aria-pressed='true'] { box-shadow: var(--ring-acc); background: var(--acc-t2); }
@media (hover: hover) and (pointer: fine) { .ob:hover:not([aria-pressed='true']) { box-shadow: var(--ring-2), var(--sh-1); } }
.ord-h { margin-top: var(--sp-3); font-size: var(--fs-8); }
.doc { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0; border-top: 1px solid var(--line); font-size: var(--fs-3); }
.doc:first-child { border-top: 0; }
.doc > span { display: inline-flex; gap: var(--sp-3); align-items: center; }
.doc > span svg.i { color: var(--mut2); }
.person { display: flex; gap: var(--sp-4); align-items: center; }
.avatar { position: relative; overflow: hidden; width: var(--h-lg); height: var(--h-lg); border-radius: 50%; background: var(--grad); color: var(--on-night); display: grid; place-items: center; font-weight: var(--fw-semi); flex: none; box-shadow: 0 0 0 3px var(--card), 0 0 0 4px var(--acc-l); }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.reach { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); font-size: var(--fs-2); color: var(--mut); }
.reach span { display: inline-flex; gap: var(--sp-2); align-items: center; }
.reach svg.i { width: var(--ico-sm); height: var(--ico-sm); color: var(--acc); }
.cp { display: inline-flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-semi); color: var(--acc); transition: color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.cp:active { transform: scale(var(--press)); }
@media (hover: hover) and (pointer: fine) { .cp:hover { color: var(--acc-h); } }
.iban { background: var(--well); border-radius: var(--r-md); padding: var(--sp-4); }

/* ---------- Departures ---------- */
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: var(--sp-5); }
.dc { padding: var(--sp-6); display: grid; gap: var(--sp-5); transition: box-shadow var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
.dc .route { font-size: var(--fs-7); }
.dc .mode { margin: calc(var(--sp-6) * -1) calc(var(--sp-6) * -1) 0; height: 140px; border-radius: var(--r-lg) var(--r-lg) 0 0; overflow: hidden; }
.dc .mode img { width: 100%; height: 100%; object-fit: cover; }
.dc .hd3 { display: flex; justify-content: space-between; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
.dc .hd3 > span { display: flex; gap: var(--sp-2); }
.meter-h { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-3); margin-bottom: var(--sp-2); }
@media (hover: hover) and (pointer: fine) { .dc:hover { box-shadow: 0 0 0 1px color-mix(in oklch, var(--acc) 18%, var(--line)), var(--sh-2); transform: translateY(var(--lift)); } }

/* ---------- Apply / pending ---------- */

@container vp (min-width: 721px) { .sheet { inset-inline: auto var(--sp-6); bottom: var(--sp-6); width: 420px; border-radius: var(--r-xl); padding-top: var(--sp-6); max-height: calc(100% - var(--sp-9)); transform: translateY(var(--dy, calc(100% + var(--sp-6)))); } .sheet .grab { display: none; } }
.pin { position: absolute; z-index: 8; width: var(--h-xs); height: var(--h-xs); border-radius: 50%; background: var(--sun); color: oklch(0.2 0.04 40); font: var(--fw-bold) var(--fs-1)/var(--h-xs) var(--mono); text-align: center; box-shadow: 0 0 0 3px var(--card), 0 6px 14px oklch(0 0 0 / 0.25); transition: transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out); inset-block-start: calc(var(--sp-3) * -1); inset-inline-start: calc(var(--sp-3) * -1); }
.pin:active { transform: scale(0.92); }

@media (hover: hover) and (pointer: fine) { .pin:hover { transform: scale(1.12); } }
.hasp { position: relative; }
/* re-render after a click: land in the settled state without replaying reveals */
.settled *, .settled *::before, .settled *::after { transition: none !important; }
.ratc { position: absolute; inset-inline-end: var(--sp-5); bottom: var(--sp-5); width: min(390px, calc(100% - var(--sp-8))); background: var(--card); border-radius: var(--r-xl); padding: var(--sp-6); box-shadow: var(--ring), 0 30px 60px -24px oklch(0.1 0.04 256 / 0.45); pointer-events: auto; display: grid; gap: var(--sp-3); font-size: var(--fs-3); transform-origin: bottom right; transition: transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out); }

/* ---------- Narrow container (phone, or any narrow window) ---------- */
@container vp (max-width: 1000px) {
  .hero { grid-template-columns: 1fr; gap: var(--sp-8); }
  .stagehero { padding: var(--sp-10) var(--sp-8) var(--sp-13); }
  .stagehero .photo { width: 100%; height: 60%; inset: 0 0 auto 0; -webkit-mask-image: linear-gradient(180deg, black 20%, transparent); mask-image: linear-gradient(180deg, black 20%, transparent); }
  .stagehero::after, [dir='rtl'] .stagehero::after { background: linear-gradient(180deg, color-mix(in oklch, var(--night) 45%, transparent), var(--night) 55%); }
  .two, .pdp { grid-template-columns: 1fr; gap: var(--sp-7); }

  .grp-h { padding: var(--sp-4); }

/* ---------- Arabic and RTL ---------- */
[dir='rtl'] body, [dir='rtl'] .app, .app[dir='rtl'] { font-family: 'Geist', 'Noto Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif; }
.app[dir='rtl'] { line-height: 1.7; }
.app[dir='rtl'] *, .app[dir='rtl'] *::before { letter-spacing: 0 !important; }
.app[dir='rtl'] h1, .app[dir='rtl'] h2, .app[dir='rtl'] h3, .app[dir='rtl'] h4, .app[dir='rtl'] .route { font-family: 'Noto Sans Arabic', var(--display); line-height: 1.35; }
.app[dir='rtl'] .hero h1 { line-height: 1.3; }

/* ---------- Motion ---------- */
/* Route changes are frequent, so the page entrance stays small and quick. */
.enter .rise { animation: rise var(--dur-base) var(--ease-out) both; animation-delay: calc(var(--d, 0) * var(--stagger)); }
@keyframes rise { from { opacity: 0; transform: translateY(var(--sp-2)); } }
/* The home hero is the one authored moment: a slower, blurred settle. */
.enter .stagehero .rise { animation-name: settle; animation-duration: var(--dur-reveal); animation-delay: calc(var(--stagger-lg) + var(--d, 0) * var(--stagger-lg)); }
@keyframes settle { from { opacity: 0; transform: translateY(var(--sp-4)); filter: blur(6px); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--dur-base); animation-timing-function: var(--ease-out); }
::view-transition-group(strip) { animation: none; }
.pxu { animation: unlock var(--dur-slow) var(--ease-out) both; }
@keyframes unlock { from { opacity: 0; transform: translateY(6px); filter: blur(5px); } }
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .sv { animation: sv linear both; animation-timeline: view(); animation-range: entry 0% entry 40%; }
    @keyframes sv { from { opacity: 0; transform: translateY(28px) scale(0.985); } }
  }
}
/* Reduced motion: drop movement, keep short opacity and color changes so state stays legible. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
  .toast, .ratc, .cap > div, .sdd, .swap > span { transition-property: opacity !important; transition-duration: var(--dur-fast) !important; }
  .bar > i, .route .ln .fl, .steps::after { transform: none !important; }
  .meter .pm .a { clip-path: inset(0 calc((1 - var(--o)) * 100%) 0 0) !important; } .meter .pm .m { clip-path: inset(0 calc((1 - var(--f)) * 100%) 0 0) !important; } .lad li.done::before { transform: scaleY(1); }
  .route .ln .trk, .live::after, .aur i { animation: none !important; display: none; }
  html { scroll-behavior: auto; }
}
@media (prefers-contrast: more) { :root { --line: oklch(0.8 0.01 255); --line2: oklch(0.65 0.01 255); --mut: oklch(0.4 0.02 255); } }

/* ---------- Utilities added for screen markup (token-backed) ---------- */

/* ---------- Quick-order card (Order again, similar deals) ---------- */
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: var(--sp-5); }
.qo { display: grid; grid-template-rows: subgrid; grid-row: span 5; align-content: start; gap: var(--sp-4); padding: var(--sp-4) var(--sp-4) var(--sp-5); border-radius: var(--r-xl); background: var(--card); box-shadow: var(--ring), var(--sh-1); transition: box-shadow var(--dur-base) var(--ease-out); }
.qo-x { display: grid; gap: var(--sp-4); align-content: start; } /* subgrid rows: head, departure, qty and button line up across a row of cards */
.qo-h { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--sp-4); align-items: center; }

.qdeps { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: var(--sp-2); }
.qdep { display: grid; gap: 2px; text-align: start; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--card); box-shadow: var(--ring); font-size: var(--fs-3); transition: box-shadow var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.qdep:active { transform: scale(var(--press)); }
.qdep[aria-pressed='true'] { box-shadow: var(--ring-acc); background: var(--acc-t2); }
.qo-f { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }

.qo-f .stepper output { min-width: var(--sp-8); }
.qo-tot { display: grid; justify-items: end; text-align: end; }

@media (hover: hover) and (pointer: fine) {
  .qo:hover { box-shadow: 0 0 0 1px color-mix(in oklch, var(--acc) 16%, var(--line)), var(--sh-2); }
  .qo-h:hover h3 { color: var(--acc); }

  .qdep:hover:not([aria-pressed='true']) { box-shadow: var(--ring-2), var(--sh-1); }
}

/* ---------- Ways to pay less (cart) ---------- */
.save { margin-bottom: var(--sp-5); padding: var(--sp-5) var(--sp-6); border-radius: var(--r-lg); background: linear-gradient(120deg, var(--sun-b), var(--card) 70%); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--sun) 28%, transparent), var(--sh-1); }

.save-r:first-of-type { border-top: 0; }
.save-r .ico { width: var(--sp-10); height: var(--sp-10); border-radius: var(--r-md); display: grid; place-items: center; background: var(--card); color: var(--sun-ink); box-shadow: var(--ring); }
.save-r .ph { aspect-ratio: 1; }
.save-a { display: grid; justify-items: end; gap: var(--sp-2); }
.save-a .amt { font: var(--fw-semi) var(--fs-3) var(--mono); color: var(--ok); white-space: nowrap; }
.save .note { margin-top: 0; }
@container vp (max-width: 720px) {
  .save { padding: var(--sp-4); }
  .save-r { grid-template-columns: var(--sp-9) minmax(0, 1fr); }
  .save-r .ico { width: var(--sp-9); height: var(--sp-9); }
  .save-a { grid-column: 1 / -1; grid-template-columns: auto auto; justify-content: space-between; align-items: center; }
}

/* ---------- Over capacity: change departure on the line ---------- */
.chgdep { display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-xs); padding: 0 var(--sp-3); border-radius: var(--r-pill); background: var(--bad-b); color: var(--bad); font-size: var(--fs-2); font-weight: var(--fw-semi); transition: background-color var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.chgdep svg.i { width: 14px; height: 14px; }
.chgdep:active { transform: scale(var(--press)); }
.chgdep[aria-expanded='true'] { background: var(--bad); color: var(--on-night); }
@media (hover: hover) and (pointer: fine) { .chgdep:not([aria-expanded='true']):hover { background: color-mix(in oklch, var(--bad) 16%, white); } }
.mvpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--sp-2); margin-top: var(--sp-3); padding: var(--sp-3); border-radius: var(--r-lg); background: var(--well); }
.mvpick.open { animation: accin var(--dur-base) var(--ease-out); transform-origin: top; }
.mvpick > .lnk { grid-column: 1 / -1; justify-self: start; }
.mvt { display: grid; gap: var(--sp-1); text-align: start; padding: var(--sp-3); border-radius: var(--r-md); background: var(--card); box-shadow: var(--ring); font-size: var(--fs-2); transition: box-shadow var(--dur-fast) ease, transform var(--dur-press) var(--ease-out); }
.mvt b { font-size: var(--fs-3); }
.mvt:active:not([disabled]) { transform: scale(var(--press)); }
.mvt[disabled] { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
@media (hover: hover) and (pointer: fine) { .mvt:hover:not([disabled]) { box-shadow: var(--ring-acc), var(--sh-1); } }
.grp-h .notice { margin-top: var(--sp-1); }

/* ---------- Buy again ---------- */
.oline > span:first-child { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); }
.oline .lnk { font-size: var(--fs-2); }
.oline .lnk svg.i { width: 14px; height: 14px; }
.sheet-h .ico { width: var(--sp-8); height: var(--sp-8); border-radius: var(--r-md); display: grid; place-items: center; background: var(--grad-soft); color: var(--acc); flex: none; }
.sheet .qo { padding: 0; box-shadow: none; background: none; }
@media (hover: hover) and (pointer: fine) { .sheet .qo:hover { box-shadow: none; } }

/* ---------- Home layout: Proposed (presenter strip switch; Current is untouched) ---------- */
#layoutSg[hidden] { display: none; }
[data-layout='proposed'] .p-promo .stagehero { padding: var(--sp-6) var(--sp-10) var(--sp-5); }
[data-layout='proposed'] .p-promo .hero { gap: var(--sp-8); }
[data-layout='proposed'] .p-promo .hero h1 { font-size: 40px; max-width: 15em; }
[data-layout='proposed'] .p-promo .hero .lead { margin-top: var(--sp-3); font-size: 17px; max-width: 40em; }
[data-layout='proposed'] .p-promo .hero .cta { margin-top: var(--sp-4); }
[data-layout='proposed'] .p-promo .dep { padding: var(--sp-4) var(--sp-5); gap: var(--sp-2); }
[data-layout='proposed'] .p-promo .dep-foot { padding-top: var(--sp-3); }
[data-layout='proposed'] .p-promo .dep-sub { margin-top: 0; }
[data-layout='proposed'] .p-promo .route { font-size: 26px; }
.p-strip { padding-top: var(--sp-4); }
.p-strip .card { padding: var(--sp-3) var(--sp-5); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3) var(--sp-6); flex-wrap: wrap; font-size: var(--fs-3); line-height: 1.5; }
.p-chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.p-chips .fc { display: inline-flex; align-items: center; gap: var(--sp-2); }
.p-chips .org { width: 20px; height: 14px; border-radius: 2px; flex: none; }
[data-layout='proposed'] .p-deals .sec { padding-top: var(--sp-5); }
.p-deals .sh { margin-bottom: var(--sp-3); }
.p-deals .sh h2 { font-size: 26px; }
.p-deals .sh p { display: none; }
.p-deals .pc .ph { aspect-ratio: 16 / 10; }
.p-dealsp { margin-top: var(--sp-3); font-size: var(--fs-3); }
[data-layout='proposed'] .sec { padding-top: var(--sp-11); }
.p-who { padding-top: var(--sp-11); }
.p-who .ident { margin: 0; }
</style>

    return new Intl.NumberFormat(KM.LOC[lang], { style: 'currency', currency: cur }).format(KM.conv(n, cur));
  },
  num: (n, lang) => new Intl.NumberFormat(KM.LOC[lang]).format(n),
  date(m, d, lang) {
    const p = new Intl.DateTimeFormat(KM.LOC[lang], { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })
      .formatToParts(new Date(Date.UTC(2026, m - 1, d, 12)));
    const g = (t) => (p.find((x) => x.type === t) || {}).value || '';
    return g('weekday') + ' ' + g('day') + ' ' + g('month');
  },
  tierFor(tiers, p) { let x = tiers[0]; tiers.forEach((y) => { if (p >= y.min) x = y; }); return x; },
  /* One order line: product + quantity (pallets, or containers for a lot) + departure. */
  calc(pr, qty, dep) {
    if (pr.shape === 'lot') {
      const goods = KM.r2(qty * pr.tonnes * pr.ppt);
      const freight = KM.r2(qty * dep.rate);
      return { goods, freight, invoice: KM.r2(goods + freight), unit: pr.ppt, cases: 0 };
    }
    const tier = KM.tierFor(pr.tiers, qty);
    const cases = qty * pr.pc;
    const goods = KM.r2(cases * tier.price);
    const freight = KM.r2(qty * dep.rate);
    return { goods, freight, invoice: KM.r2(goods + freight), unit: tier.price, cases };
  },
  /* Support runs Mon-Fri 09:00-17:00 Dubai (UTC+4). Returns the same window in the buyer's time zone. */
  hours(tz, lang) {
    const f = (h) => new Intl.DateTimeFormat(KM.LOC[lang], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: tz })
      .format(new Date(Date.UTC(2026, 9, 19, h - 4, 0)));
    return [f(9), f(17)];
  }
};

/* Pallet meter: boxes instead of a bar, one per pallet group, filled as space is taken.

function meter(filled, cap, mine = 0) {
  const n = cap <= 12 ? cap : [12, 11, 10, 9, 8].find((k) => cap % k === 0) || 12;
  const per = cap / n, cl = (v) => Math.max(0, Math.min(1, v)).toFixed(2);
  const cells = Array.from({ length: n }, (_, i) => `<span class="pm" style="--i:${i};--f:${cl(filled / per - i)};--o:${cl((filled - mine) / per - i)}"><svg class="i"><use href="#i-box"/></svg>${mine ? '<svg class="i m"><use href="#if-box"/></svg>' : ''}<svg class="i a"><use href="#if-box"/></svg></span>`).join('');
  return `<div class="meter reveal-in" role="img" aria-label="${esc(t('reservedN', filled, cap))}" style="--n:${n}">${cells}</div>${per > 1 || mine ? `<div class="meter-key">${per > 1 ? `<span>${ic('box')}${t('perBox', per)}</span>` : ''}${mine ? `<span><i class="sw"></i>${t('yours')}</span>` : ''}</div>` : ''}`;
}
/* ---------- buyer history: what a rep would remember ---------- */
const DAYN = (d) => d[0] * 100 + d[1];
function buyHist() {
  const h = {};
  Object.values(ORDERS).filter((o) => !o.declined).concat(S.orders).forEach((o) => o.lines.forEach((l) => {
    const pr = PRODUCTS.find((p) => p.name === l[0]); if (!pr) return;
    const x = h[pr.id] || (h[pr.id] = { pr, n: 0, pal: 0, last: [0, 0] });
    x.n++; x.pal += l[1]; if (DAYN(o.placed) > DAYN(x.last)) x.last = o.placed;
  }));
  return Object.values(h).map((x) => Object.assign(x, { usual: Math.max(1, Math.round(x.pal / x.n)) })).sort((a, b) => b.n - a.n || b.pal - a.pal);
}
/* Deals the buyer hasn't ordered, scored against what they have: brand 2, origin 1, pack 1. */
function similarDeals(hist) {
  const own = new Set(hist.map((x) => x.pr.id)), brand = (p) => p.name.split(' ')[0];
  return PRODUCTS.filter((p) => p.low && !own.has(p.id)).map((p) => {
    let like = null, sc = 0;
    hist.forEach((x) => { const v = (brand(x.pr) === brand(p) ? 2 : 0) + (x.pr.org === p.org ? 1 : 0) + (x.pr.pt === p.pt ? 1 : 0); if (v > sc) { sc = v; like = x.pr; } });
    return { p, sc, like };
  }).filter((x) => x.sc >= 2).sort((a, b) => b.sc - a.sc || cut(b.p) - cut(a.p)).slice(0, 3);
}
/* Per litre for drinks (VOL in data.js). */
const perL = (pr, price) => (VOL[pr.id] ? price / (nUnits(pr) * VOL[pr.id]) : null);
/* A similar product that rides the same departure and is cheaper per pallet AND at least 10% per litre. */
function altFor(pr, dep) {
  if (isLot(pr) || !VOL[pr.id]) return null;
  const me = offersFor(pr)[0].tiers[0].price, myL = perL(pr, me), myPal = me * pr.pc;
  return PRODUCTS.filter((p) => p.id !== pr.id && p.pt === pr.pt && VOL[p.id] && offersFor(p)[0].deps.includes(dep))
    .map((p) => ({ p, l: perL(p, p.tiers[0].price), pal: p.tiers[0].price * p.pc }))
    .filter((x) => x.pal < myPal && x.l <= myL * 0.9).sort((a, b) => a.l - b.l)[0] || null;
}
/* Quick-order state for a product card on the home page. */
function qoState(pr, qty) {

  const c = KM.calc({ shape: pr.shape, pc: pr.pc, tiers: offs.tiers, tonnes: pr.tonnes, ppt: pr.ppt }, st.qty, DEPS[st.dep]);
  return { st, deps, c };
}

let enterTimer;
function render(enter) {

  const top = sc.scrollTop;
  app.setAttribute('dir', dirOf());

  document.documentElement.setAttribute('data-pal', S.pal);

  document.body.classList.toggle('marks', S.marks);
  $('#stage').className = 'stage ' + (S.device === 'phone' ? 'phone' : '');
  app.classList.toggle('enter', !!enter);
  const f = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  app.innerHTML = shell();
  sc.scrollTo({ top: enter ? 0 : top, behavior: 'instant' });
  S.just = false; S.tick = false; S.roll = null; S.galIn = false; S.mvJust = false;
  if (f) { const el = $(`[data-f="${f}"]`, app); if (el) el.focus({ preventScroll: true }); }
  clearTimeout(enterTimer); if (enter) enterTimer = setTimeout(() => app.classList.remove('enter'), 1200);
  observe(enter);

  syncHash();
}
/* View transition wrapper: crossfade for state that changes a lot at once. */
function vt(fn) {
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { const v = document.startViewTransition(fn); [v.ready, v.finished, v.updateCallbackDone].forEach((p) => p.catch(() => {})); } // aborts when the page is hidden or interrupted; the DOM update still runs
  else fn();
}
/* Scroll-linked effects without scroll listeners. */
let io, sIo;
function observe(enter) {
  const sc = $('#sc');
  if (io) io.disconnect(); if (sIo) sIo.disconnect();
  io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { root: sc, threshold: 0.25 });
  const revs = $$('.bar, .route, .lad, .reveal-in');
  if (enter) revs.forEach((el) => io.observe(el));
  else { // a re-render after a click: show the settled state, no replay
    const app = $('#app'); app.classList.add('settled'); revs.forEach((el) => el.classList.add('in'));
    setTimeout(() => app.classList.remove('settled'), 34); // two frames; a timer still fires in a throttled tab
  }
  const hd = $('#hd');
  if (hd) {
    const sent = document.createElement('div'); sent.style.cssText = 'position:absolute;top:0;height:8px;width:1px;pointer-events:none'; $('#app').prepend(sent);
    sIo = new IntersectionObserver((es) => hd.classList.toggle('stuck', !es[0].isIntersecting), { root: sc });
    sIo.observe(sent);
  }
}

/* ---------- routing ---------- */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const q = new URLSearchParams(qs || '');
  return { path: path || 'home', q };
}
function applyHash() {
  const { path, q } = parseHash();
  Object.keys(VALID).forEach((k) => { const v = q.get(k); if (v && VALID[k].includes(v)) S[k] = v; });
  if (q.get('marks')) S.marks = q.get('marks') === '1';
  if (q.get('rat')) S.rat = q.get('rat') === '1';
  if (q.get('pid') && PBY[q.get('pid')]) { S.sel = { pid: q.get('pid'), off: 'o1', dep: null, qty: Math.max(1, offersFor(PBY[q.get('pid')])[0].moq), img: 0, lotInco: 'cif' }; }
  if (q.get('tab') && ['deals', 'new', 'soon'].includes(q.get('tab'))) S.dtab = q.get('tab');
  if (q.get('o') && ORIGINS.some((x) => x.code === q.get('o'))) { S.flt.orig = { [q.get('o')]: true }; }
  const scr = SCREENS.some((x) => x[0] === path) ? path : 'home';
  S.screen = guard(scr);

function lineInfo(l) {
  const pr = PBY[l.pid], offs = offersFor(pr), off = offs.find((o) => o.id === l.off) || offs[0];

  return { l, pr, off, d: DEPS[l.dep], prod, c: KM.calc(prod, l.qty, DEPS[l.dep]) };
}
const palIn = (dep) => S.cart.filter((l) => l.dep === dep).reduce((a, l) => a + l.qty, 0);
const room = (dep) => DEPS[dep].cap - DEPS[dep].filled;
function cartTotals() {
  const li = S.cart.map(lineInfo);
  const goods = KM.r2(li.reduce((a, x) => a + x.c.goods, 0)), freight = KM.r2(li.reduce((a, x) => a + x.c.freight, 0));
  return { li, goods, freight, invoice: KM.r2(goods + freight), qty: S.cart.reduce((a, l) => a + l.qty, 0), over: [...new Set(S.cart.map((l) => l.dep))].some((id) => palIn(id) > room(id)) };
}

function savings(tt) {
  const out = [];
  tt.li.forEach((x) => {
    if (isLot(x.pr)) return;
    const k = S.cart.indexOf(x.l), cur = KM.tierFor(x.off.tiers, x.l.qty).price, nx = x.off.tiers.find((y) => y.min > x.l.qty);
    if (nx && nx.min - x.l.qty === 1 && palIn(x.l.dep) + 1 <= room(x.l.dep)) out.push({ kind: 'tier', k, x, nx, cur, save: KM.r2(x.c.cases * (cur - nx.price)) });
    const alt = altFor(x.pr, x.l.dep);
    if (alt && !S.cart.some((l) => l.pid === alt.p.id && l.dep === x.l.dep)) {
      const ac = KM.calc({ pc: alt.p.pc, tiers: offersFor(alt.p)[0].tiers }, x.l.qty, DEPS[x.l.dep]);
      out.push({ kind: 'swap', k, x, alt, save: KM.r2(x.c.goods - ac.goods), myL: perL(x.pr, cur) });
    }
  });
  return out;
}

  addFile: ['Add file', 'Ajouter un fichier', 'أضف ملفاً'], removeF: ['Remove', 'Retirer', 'إزالة'], missing: ['Missing', 'Manquant', 'مفقود'], added2: ['Added (sample)', 'Ajouté (exemple)', 'أُضيف (نموذج)'],
  aAgree: ['I confirm these details are correct and I can legally represent the company.', 'Je confirme que ces informations sont exactes et que je peux représenter légalement l\'entreprise.', 'أؤكد أن هذه البيانات صحيحة وأنني أمثّل الشركة قانونياً.'],
  aSend: ['Send application', 'Envoyer la demande', 'أرسل الطلب'], aFill: ['Fill sample details', 'Remplir avec des données d\'exemple', 'املأ ببيانات تجريبية'],
  aNeed: [(x) => `To send: ${x}.`, (x) => `Pour envoyer : ${x}.`, (x) => `للإرسال: ${x}.`],
  errCo: ['Enter your company name.', 'Saisissez le nom de votre entreprise.', 'أدخل اسم شركتك.'], errReg: ['Enter your registration number.', 'Saisissez votre numéro d\'immatriculation.', 'أدخل رقم تسجيل شركتك.'], errTax: ['Enter your tax or VAT number.', 'Saisissez votre numéro fiscal ou de TVA.', 'أدخل رقمك الضريبي.'],
  errName: ['Enter your full name.', 'Saisissez votre nom complet.', 'أدخل اسمك الكامل.'], errMail: ['Enter a work email like name@company.com.', 'Saisissez un e-mail professionnel du type nom@entreprise.com.', 'أدخل بريداً مثل name@company.com.'],
  bizOnly: ['Business accounts only. Personal accounts are not offered.', 'Comptes professionnels uniquement. Les comptes particuliers ne sont pas proposés.', 'حسابات الأعمال فقط. لا تتوفر حسابات شخصية.'],
  afterH: ['After you apply', 'Après votre demande', 'بعد التقديم'], af1: ['We check the documents, usually within one business day.', 'Nous vérifions les documents, en général sous un jour ouvré.', 'نتحقق من المستندات عادةً خلال يوم عمل.'], af2: ['You see indicative prices while you wait.', 'Vous voyez des prix indicatifs en attendant.', 'ترى أسعاراً إرشادية أثناء الانتظار.'], af3: ['Once approved, wholesale prices, departures and ordering open.', 'Une fois approuvé, les prix de gros, les départs et la commande s\'ouvrent.', 'بعد الموافقة تُفتح أسعار الجملة والرحلات والطلب.'],
  /* Pending */
  penH: ['Application received', 'Demande reçue', 'استلمنا طلب التقديم'], penP: ['We are checking your documents. You can browse indicative prices while you wait.', 'Nous vérifions vos documents. Vous pouvez consulter les prix indicatifs en attendant.', 'نتحقق من مستنداتك. يمكنك تصفح الأسعار الإرشادية أثناء الانتظار.'],
  tk: [['Application received', 'Demande reçue', 'استلمنا الطلب'], ['Documents checked', 'Documents vérifiés', 'فحص المستندات'], ['Account approved', 'Compte approuvé', 'اعتماد الحساب'], ['Prices unlocked', 'Prix débloqués', 'فتح الأسعار']],
  tkP: [['We have your application and documents.', 'Nous avons votre demande et vos documents.', 'لدينا طلبك ومستنداتك.'], ['A person reads the company and identity files. Usually one business day.', 'Une personne lit les pièces de l\'entreprise et d\'identité. En général un jour ouvré.', 'يقرأ موظف ملفات الشركة والهوية. عادةً يوم عمل.'], ['You get an email as soon as the account is approved.', 'Vous recevez un e-mail dès l\'approbation du compte.', 'تصلك رسالة بريدية فور اعتماد الحساب.'], ['Wholesale prices, departures and ordering open.', 'Prix de gros, départs et commande s\'ouvrent.', 'تُفتح أسعار الجملة والرحلات والطلب.']],
  meanwhile: ['While you wait', 'En attendant', 'أثناء الانتظار'], simApprove: ['Preview the approved account', 'Aperçu du compte approuvé', 'معاينة الحساب المعتمد'], protoOnly: ['Prototype shortcut', 'Raccourci du prototype', 'اختصار النموذج']
});

SCR.departures = () => {
  const lanes = [['all', 'allOrig'], ['DZ', null], ['BE', null], ['US', null], ['VN', null]];
  const list = Object.keys(DEPS).filter((k) => !DEPS[k].hidden && (S.lane === 'all' || DEPS[k].lane === S.lane));
  const cards = list.map((id, i) => {
    const d = DEPS[id], free = d.cap - d.filled, pct = Math.round((d.filled / d.cap) * 100);
    return `<article class="card dc reveal-in hasp">${i === 0 ? pin('fill') : ''}${im('mode/' + d.mode) ? `<div class="mode">${imgTag('mode/' + d.mode, '')}</div>` : ''}<div class="row btw g-3"><b class="mono">${id}</b><span class="row g-2">${chip(d.temp === 'Ambient' ? L3(['Ambient', 'Ambiant', 'محيطي']) : d.temp)}${chip(d.st === 'closing' ? t('stClosing') : t('stOpen'), d.st === 'closing' ? 'warn' : 'ok')}</span></div>
    <div class="route"><span>${L3(PLACE[d.from])}</span>${routeLine()}<span>${L3(PLACE[d.to])}</span></div>
    <div class="mut dep-sub t-3">${L3(MODE[d.mode])} · ${esc(d.note)}</div>
    <div class="k3"><div><span class="lab">${t('orderBy')}</span><b class="mono">${D(d.cut)}</b></div><div><span class="lab">${t('departs')}</span><b class="mono">${D(d.dep)}</b></div><div><span class="lab">${t('arrives')}</span><b class="mono">${D(d.eta)}</b></div></div>
    <div><div class="row btw t-3 mb-2 g-2"><span>${t('reservedN', d.filled, d.cap)}</span><b>${pct}%</b></div>${meter(d.filled, d.cap)}<div class="mut t-2 mt-2">${t('freeN', free)}${d.wt ? ' · ' + d.wt : ''}</div></div>
    <div class="dep-foot"><div><span class="lab">${t('frPerPal')}</span><b class="mono t-6">${m(d.rate)}</b></div><a class="btn sm" href="#/category?o=${d.lane}">${t('chooseP')}${arrow}</a></div></article>`;
  }).join('');
  return `<div class="wrap sec first"><div class="rise"><h1 class="pgh">${t('depH')}</h1><p class="mut mt-3 mb-6 measure">${t('depSub')}</p></div><div class="tabs mb-6" role="group">${lanes.map(([k, l]) => `<button class="fc" data-a="lane" data-v="${k}" aria-pressed="${S.lane === k}">${l ? t(l) : (k === 'US' ? L3(COUNTRY.US) : L3(COUNTRY[k]))}</button>`).join('')}<span class="mut as-c ms-2">${t('depCount', list.length)}</span></div><div class="dgrid">${cards}</div></div>`;
};
A.lane = (el) => { S.lane = el.dataset.v; render(false); };

/* ---------- Apply ---------- */
const SAMPLE_APPLY = { fr: { co: 'Épicerie Orient SARL', reg: '812 345 678 00019', tax: 'FR12 812345678', name: 'Camille Laurent', mail: 'camille@epicerie-orient.example', tel: '+33 1 84 00 00 00' }, dz: { co: 'Supermarché El Djazair SPA', reg: '16/00-0123456B21', tax: '000 016 012 345 678', name: 'Yasmine Haddad', mail: 'yasmine@eldjazair.example', tel: '+213 21 00 00 00' } };
function applyErrs() {
  const a = S.apply, v = a.v || {}, e = {};
  if (!v.co) e.co = 'errCo'; if (!v.reg) e.reg = 'errReg'; if (!v.tax) e.tax = 'errTax'; if (!v.name) e.name = 'errName';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.mail || '')) e.mail = 'errMail';
  return e;
}
SCR.apply = () => {
  const a = S.apply, v = a.v || (a.v = {}), er = a.err ? applyErrs() : {}, mk = S.market;
  const fld = (k, lbl, ph, type) => `<label class="field ${er[k] ? 'err' : ''}"><span>${lbl}</span><input data-fv="${k}" data-f="a-${k}" type="${type || 'text'}" value="${esc(v[k] || '')}" placeholder="${esc(ph)}" ${er[k] ? 'aria-invalid="true"' : ''} autocomplete="off">${er[k] ? `<span class="em" role="alert">${ic('alert')}${t(er[k])}</span>` : ''}</label>`;
  const need = []; if (!a.kbis) need.push(L3(T.dReg[mk]).toLowerCase()); if (!a.pass) need.push(L3(['the passport', 'le passeport', 'جواز السفر'])); if (!a.agree) need.push(L3(['the confirmation box', 'la case de confirmation', 'خانة التأكيد']));
  const doc = (key, name, hint) => `<div class="docp"><div><b>${name}</b><div class="mut t-2">${hint}</div></div><div class="row g-3">${chip(a[key] ? t('added2') : t('missing'), a[key] ? 'ok' : 'warn')}<button class="btn ghost sm" data-a="adoc" data-k="${key}">${a[key] ? ic('x') + t('removeF') : ic('upload') + t('addFile')}</button></div></div>`;
  return `<div class="wrap sec first"><div class="two"><div><div class="rise"><h1 class="pgh">${t('appH')}</h1><p class="mut mt-3 measure">${t('appSub')}</p></div>
  <div class="notice hasp mt-6">${pin('apply')}${ic('info')}<span>${t('bizOnly')}${sm()}</span></div>
  <form id="apf" class="fs mt-6" novalidate><div class="frm">${fld('co', t('aCo'), mk === 'fr' ? 'Épicerie Orient SARL' : 'Supermarché El Djazair SPA')}${fld('reg', L3(T.aReg[mk]), mk === 'fr' ? '812 345 678 00019' : '16/00-0123456B21')}${fld('tax', L3(T.aTax[mk]), mk === 'fr' ? 'FR12 812345678' : '000 016 012 345 678')}${fld('name', t('aName'), 'Camille Laurent')}${fld('mail', t('aMail'), 'name@company.com', 'email')}${fld('tel', t('aTel'), '+33 1 84 00 00 00', 'tel')}</div>
  <div><h2 class="t-6">${t('aDocs')}</h2><p class="mut mt-1 mb-4 t-3">${t('aDocsP')}</p><div class="stack g-3">${doc('kbis', L3(T.dReg[mk]), t('dRegH'))}${doc('pass', t('dPass'), t('dPassH'))}</div></div>
  <label class="chk"><input type="checkbox" data-a="aagree" ${a.agree ? 'checked' : ''}><span>${t('aAgree')}</span></label>
  <div class="row g-3"><button type="button" class="btn ${need.length ? 'off' : ''}" data-a="asend" ${need.length ? 'aria-disabled="true"' : ''}>${ic('send')}${t('aSend')}</button><button type="button" class="btn ghost" data-a="afill">${ic('edit')}${t('aFill')}</button></div>
  ${need.length ? `<p class="mut t-2">${t('aNeed', need.join(', ').replace(/, ([^,]*)$/, ' / $1'))}</p>` : ''}</form></div>
  <aside class="side"><div class="card pad"><h3 class="t-5 mb-3">${t('afterH')}</h3><ol class="stack t-3 g-3"><li>${t('af1')}${sm()}</li><li>${t('af2')}</li><li>${t('af3')}</li></ol></div><div class="card pad">${contactCard()}</div></aside></div></div>`;
};
A.adoc = (el) => { S.apply[el.dataset.k] = !S.apply[el.dataset.k]; render(false); };
A['aagree:change'] = (el) => { S.apply.agree = el.checked; render(false); };
A.afill = () => { Object.assign(S.apply, { v: Object.assign({}, SAMPLE_APPLY[S.market]), kbis: true, pass: true, agree: true, err: false }); render(false); };
A.asend = () => {
  const a = S.apply, e = applyErrs();
  if (Object.keys(e).length || !a.kbis || !a.pass || !a.agree) { a.err = true; render(false); const first = $('.field.err input'); if (first) first.focus(); return; }
  S.stage = 'pending'; S.just = true; location.hash = '#/pending';
};

/* ---------- Application received ---------- */
SCR.pending = () => {
  const mk = MARKETS[S.market];
  const steps = [0, 1, 2, 3].map((i) => `<li class="${i === 0 ? 'done' : i === 1 ? 'now' : 'nx'}" style="--i:${i}"><span class="dt">${i === 0 ? ic('check') : ''}</span><div><b>${L3(T.tk[i])}</b><p>${L3(T.tkP[i])}${i === 1 ? sm() : ''}</p></div><time>${['Tue 13 Oct', 'By Wed 14 Oct', '', ''][i]}</time></li>`).join('');
  return `<div class="wrap sec first"><div class="two"><div><div class="rise row top g-5"><span class="ok-ring">${ic('checkdraw')}</span><div><h1 class="pgh">${t('penH')}</h1><p class="mut mt-3 measure">${t('penP')}</p></div></div>
  <div class="card pad hasp mt-7">${pin('apply')}<ol class="lad reveal-in">${steps}</ol></div>
  <div class="row mt-6 g-3"><a class="btn" href="#/category">${ic('tag')}${t('browsePrices')}</a><button class="btn ghost" data-a="approve">${ic('eye')}${t('simApprove')}</button></div><p class="mut t-2 mt-2">${t('protoOnly')}</p></div>
  <aside class="side"><div class="card pad">${contactCard()}</div><div class="mail"><div class="mh"><b class="ink">${t('emailPrev')}</b><span>To: ${esc(mk.co)}</span><span>${t('penH')}</span></div><div class="mb"><p>${t('penP')}</p></div></div></aside></div></div>`;
};
A.approve = () => { setState('stage', 'approved'); toast(t('signedIn')); };
</script>
</body>
</html>
